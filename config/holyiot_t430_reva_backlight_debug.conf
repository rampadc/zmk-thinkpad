# Staged Rev A backlight diagnosis over USB CDC.
CONFIG_THINKPAD_T430_REVA_BACKLIGHT_TEST=y

CONFIG_LOG=y
CONFIG_ZMK_LOGGING_MINIMAL=n
CONFIG_ZMK_LOG_LEVEL_DBG=y
CONFIG_USE_SEGGER_RTT=n
CONFIG_RTT_CONSOLE=n
CONFIG_LOG_BACKEND_RTT=n
CONFIG_UART_CONSOLE=y
CONFIG_LOG_BACKEND_UART=y

# Keep TrackPoint packet traffic from obscuring power/backlight events.
CONFIG_PS2_LOG_LEVEL_WRN=y
