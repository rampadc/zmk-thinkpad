# Keep the initial bring-up limited to the keyboard matrix.
CONFIG_ZMK_USB=y
CONFIG_ZMK_BLE=y
CONFIG_ZMK_POINTING=n

# Authenticate new hosts: type the six-digit passkey shown by the host, then Enter.
CONFIG_ZMK_BLE_PASSKEY_ENTRY=y

# Preserve BLE bonds and selected output across resets.
CONFIG_BT_MAX_CONN=3
CONFIG_BT_MAX_PAIRED=3
CONFIG_SETTINGS=y
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_NVS=y
CONFIG_SETTINGS_NVS=y

# Keep the DK's J-Link serial console available for bring-up diagnostics.
CONFIG_LOG=y
CONFIG_UART_CONSOLE=y
CONFIG_LOG_BACKEND_UART=y
CONFIG_ZMK_LOG_LEVEL_INF=y
CONFIG_LOG_BUFFER_SIZE=8192
CONFIG_LOG_PROCESS_THREAD_SLEEP_MS=10
CONFIG_LOG_PROCESS_TRIGGER_THRESHOLD=1

# Favor reliable discovery over low idle power. Poll both scanners, leave time
# for long jumper wires to settle, and tolerate bursts of scan events. The log
# thread settings avoid the deferred logger's default one-second sleep latency.
CONFIG_ZMK_KSCAN_MATRIX_POLLING=y
CONFIG_ZMK_KSCAN_DIRECT_POLLING=y
CONFIG_ZMK_KSCAN_EVENT_QUEUE_SIZE=32
CONFIG_ZMK_KSCAN_MATRIX_WAIT_BEFORE_INPUTS=50
CONFIG_ZMK_KSCAN_MATRIX_WAIT_BETWEEN_OUTPUTS=50
