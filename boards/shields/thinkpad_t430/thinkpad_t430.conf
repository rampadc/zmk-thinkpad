# USB and BLE are both first-class output transports.
CONFIG_ZMK_USB=y
CONFIG_ZMK_BLE=y
CONFIG_ZMK_POINTING=y

# Let a HID report request that a suspended USB host resume. Keep ZMK system-off
# disabled so BLE remains connected/advertising while the CPU uses normal idle.
CONFIG_USB_DEVICE_REMOTE_WAKEUP=y
CONFIG_ZMK_SLEEP=n

# T430 KBD_BL_PWM. Fn+Space cycles off, 50%, and 100%.
CONFIG_ZMK_BACKLIGHT=y
CONFIG_PWM=y
CONFIG_ZMK_BACKLIGHT_ON_START=n
CONFIG_ZMK_BACKLIGHT_BRT_START=50
CONFIG_ZMK_BACKLIGHT_BRT_STEP=50
CONFIG_ZMK_BACKLIGHT_AUTO_OFF_IDLE=y

# The pinned PS/2 module receives through uart_irq_*(), but its Kconfig only
# selects the async UART API. Enable Zephyr's interrupt-driven API so UARTE1
# allocates an RX buffer and delivers TrackPoint bytes to the module.
CONFIG_UART_INTERRUPT_DRIVEN=y

# This is a unibody build, so these values equal the desired profile count.
CONFIG_BT_MAX_CONN=3
CONFIG_BT_MAX_PAIRED=3

# Keep settings so BLE bonds, the selected endpoint, and active profile survive resets.
CONFIG_SETTINGS=y
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_NVS=y
CONFIG_SETTINGS_NVS=y

# Bring-up logging uses the DK's existing UART0/J-Link virtual serial port.
CONFIG_LOG=y
CONFIG_UART_CONSOLE=y
CONFIG_LOG_BACKEND_UART=y
CONFIG_ZMK_LOG_LEVEL_DBG=y
CONFIG_PS2_LOG_LEVEL_DBG=y
